[package]
name = "sshtool"
version = "0.7.6"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
rpassword = "7.5.4"
russh = { version = "0.61.2", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "rt", "signal", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

# Resize on Windows polls the console size on a timer; the Unix path uses SIGWINCH.
[target.'cfg(not(unix))'.dependencies]
tokio = { version = "1.52.3", features = ["time"] }
